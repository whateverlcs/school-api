
services:
  # ─── Banco de dados ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: api_node_school_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_node_school
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Aplicação Node.js ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_node_school_app
    restart: always
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/api_node_school?schema=public"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
